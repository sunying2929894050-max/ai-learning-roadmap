# Paste inside your existing server { ... } block (the SSL-enabled one).
# Assumes uvicorn is on 127.0.0.1:8787.

    # ── LLM Proxy ──────────────────────────────────────────────────
    location /api/ {
        # Only POST allowed at /api/llm; FastAPI returns 405 for others,
        # but nginx can short-circuit non-POST at the edge too.
        # Remove the limit_except block if you want FastAPI to own all 405s.
        limit_except POST OPTIONS {
            deny all;
        }

        proxy_pass         http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # SSE requires these headers
        proxy_set_header   Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Pass user-supplied key header through to FastAPI
        proxy_set_header   X-User-Key        $http_x_user_key;

        # Timeouts for streaming (keep alive during long generation)
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;

        # Body size — match MAX_BODY_BYTES in .env
        client_max_body_size 65k;
    }
    # ── /health also proxied ────────────────────────────────────────
    location /health {
        proxy_pass       http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
